name: Build Windows EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        continue-on-error: true
        run: |
          python test_smoke.py > test_output.log 2>&1 || true

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test_output.log

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "API余额查询程序" ^
            --icon assets\app.ico --version-file version_info.txt ^
            --add-data "assets\app.ico;assets" ^
            --add-data "assets\background.png;assets" ^
            --add-data "assets\fonts;assets/fonts" ^
            main.py

      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/API余额查询程序.exe
          generate_release_notes: true
